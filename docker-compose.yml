services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_app
      POSTGRES_USER: expense_app
      POSTGRES_PASSWORD: expense_app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_app -d expense_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
